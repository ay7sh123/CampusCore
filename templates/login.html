{% extends "base.html" %}
{% block title %}Sign In &bull; CAMPUSCORE{% endblock %}

{% block content %}
<div class="min-h-[80vh] flex items-center justify-center py-6 px-4 relative">
  <!-- Theme Toggle in top right -->
  <div class="absolute top-2 right-4 sm:top-6 sm:right-8">
    <button type="button" onclick="toggleTheme()" title="Toggle Dark / Light Mode" class="p-2.5 rounded-xl border border-twilight/50 bg-[#161c2e] text-steel hover:text-white transition-colors flex items-center justify-center shadow-md">
      <span class="theme-toggle-icon text-sm">☀️</span>
    </button>
  </div>
  <div class="w-full max-w-md">
    
    <!-- Header -->
    <div class="text-center mb-8">
      <div class="w-14 h-14 rounded-2xl bg-[#ff0035] flex items-center justify-center text-white font-black text-2xl mx-auto shadow-lg shadow-[#ff0035]/25 mb-4">
        C
      </div>
      <h1 class="text-2xl sm:text-3xl font-extrabold text-white tracking-tight">Welcome Back</h1>
      <p class="text-sm text-[#8b939c] mt-1.5">Sign in to your CAMPUSCORE academic account</p>
    </div>

    <!-- Login Card -->
    <div class="bg-[#161c2e] rounded-3xl p-7 sm:p-8 border border-[#38405f] shadow-2xl">
      <form method="POST" action="{{ url_for('login') }}" class="space-y-4">
        <div>
          <label class="block text-xs font-bold uppercase tracking-wider text-[#8b939c] mb-1.5" for="username">
            Username or Email
          </label>
          <div class="relative">
            <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-[#8b939c]">
              <i data-lucide="user" class="w-4 h-4"></i>
            </div>
            <input type="text" id="username" name="username" required autofocus
              placeholder="e.g. student or teacher or admin"
              class="w-full pl-10 pr-4 py-3 rounded-xl border border-[#38405f] bg-[#0e131f] focus:border-[#ff0035] focus:ring-2 focus:ring-[#ff0035]/20 text-sm font-medium text-white placeholder-[#59546c] outline-none transition-all">
          </div>
        </div>

        <div>
          <label class="block text-xs font-bold uppercase tracking-wider text-[#8b939c] mb-1.5" for="password">
            Password
          </label>
          <div class="relative">
            <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-[#8b939c]">
              <i data-lucide="lock" class="w-4 h-4"></i>
            </div>
            <input type="password" id="password" name="password" required
              placeholder="••••••••"
              class="w-full pl-10 pr-4 py-3 rounded-xl border border-[#38405f] bg-[#0e131f] focus:border-[#ff0035] focus:ring-2 focus:ring-[#ff0035]/20 text-sm font-medium text-white placeholder-[#59546c] outline-none transition-all">
          </div>
        </div>

        <button type="submit"
          class="w-full py-3.5 px-4 rounded-xl font-bold text-sm text-white bg-[#ff0035] hover:bg-[#d6002c] shadow-md shadow-[#ff0035]/25 transition-all flex items-center justify-center gap-2 mt-2">
          <span>Sign In</span>
          <i data-lucide="arrow-right" class="w-4 h-4"></i>
        </button>
      </form>

      <!-- Quick Demo Login Bar -->
      <div class="mt-6 pt-5 border-t border-[#38405f]">
        <div class="text-[11px] font-bold uppercase tracking-wider text-[#8b939c] text-center mb-2.5">
          Quick Demo Credentials (1-Click Fill)
        </div>
        <div class="grid grid-cols-3 gap-2">
          <button type="button" onclick="fillCreds('student', 'student123')"
            class="py-2 px-2.5 rounded-lg bg-[#38405f]/40 hover:bg-[#38405f] border border-[#59546c] text-xs font-semibold text-slate-200 transition-colors text-center">
            👨‍🎓 Student
          </button>
          <button type="button" onclick="fillCreds('teacher', 'teacher123')"
            class="py-2 px-2.5 rounded-lg bg-[#38405f]/40 hover:bg-[#38405f] border border-[#59546c] text-xs font-semibold text-slate-200 transition-colors text-center">
            👩‍🏫 Teacher
          </button>
          <button type="button" onclick="fillCreds('admin', 'admin123')"
            class="py-2 px-2.5 rounded-lg bg-[#38405f]/40 hover:bg-[#38405f] border border-[#59546c] text-xs font-semibold text-slate-200 transition-colors text-center">
            ⚡ Admin
          </button>
        </div>
      </div>
    </div>

    <!-- Sign Up Redirect -->
    <p class="text-center text-sm text-[#8b939c] mt-6">
      Don't have an account yet?
      <a href="{{ url_for('signup') }}" class="font-bold text-[#ff0035] hover:underline">
        Create one now &rarr;
      </a>
    </p>

    <!-- Back to Landing -->
    <div class="text-center mt-3">
      <a href="{{ url_for('landing') }}" class="text-xs text-[#59546c] hover:text-[#8b939c] font-medium">
        &larr; Back to Landing Page
      </a>
    </div>

  </div>
</div>

<script>
  function fillCreds(u, p) {
    document.getElementById('username').value = u;
    document.getElementById('password').value = p;
  }
</script>
{% endblock %}
