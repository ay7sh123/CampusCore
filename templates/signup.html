{% extends "base.html" %}
{% block title %}Sign Up &bull; CAMPUSCORE{% endblock %}

{% block content %}
<div class="min-h-[85vh] flex items-center justify-center py-6 px-4 relative">
  <!-- Theme Toggle in top right -->
  <div class="absolute top-2 right-4 sm:top-6 sm:right-8">
    <button type="button" onclick="toggleTheme()" title="Toggle Dark / Light Mode" class="p-2.5 rounded-xl border border-twilight/50 bg-[#161c2e] text-steel hover:text-white transition-colors flex items-center justify-center shadow-md">
      <span class="theme-toggle-icon text-sm">☀️</span>
    </button>
  </div>
  <div class="w-full max-w-lg">
    
    <!-- Header -->
    <div class="text-center mb-6">
      <div class="w-14 h-14 rounded-2xl bg-[#ff0035] flex items-center justify-center text-white font-black text-2xl mx-auto shadow-lg shadow-[#ff0035]/25 mb-3">
        C
      </div>
      <h1 class="text-2xl sm:text-3xl font-extrabold text-white tracking-tight">Create Your Student Account</h1>
      <p class="text-sm text-[#8b939c] mt-1">Join CAMPUSCORE to manage attendance, assignments &amp; study notes</p>
    </div>

    <!-- Signup Form Card -->
    <div class="bg-[#161c2e] rounded-3xl p-7 sm:p-8 border border-[#38405f] shadow-2xl">
      <form method="POST" action="{{ url_for('signup') }}" class="space-y-4">
        
        <!-- Full Name -->
        <div>
          <label class="block text-xs font-bold uppercase tracking-wider text-[#8b939c] mb-1" for="name">
            Full Name *
          </label>
          <div class="relative">
            <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-[#8b939c]">
              <i data-lucide="user" class="w-4 h-4"></i>
            </div>
            <input type="text" id="name" name="name" required value="{{ form.get('name', '') }}"
              placeholder="e.g. Aarav Sharma"
              class="w-full pl-10 pr-4 py-2.5 rounded-xl border border-[#38405f] bg-[#0e131f] focus:border-[#ff0035] focus:ring-2 focus:ring-[#ff0035]/20 text-sm font-medium text-white outline-none transition-all">
          </div>
        </div>

        <!-- Email & Username row -->
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-bold uppercase tracking-wider text-[#8b939c] mb-1" for="email">
              Email Address *
            </label>
            <div class="relative">
              <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-[#8b939c]">
                <i data-lucide="mail" class="w-4 h-4"></i>
              </div>
              <input type="email" id="email" name="email" required value="{{ form.get('email', '') }}"
                placeholder="aarav@example.com"
                class="w-full pl-10 pr-4 py-2.5 rounded-xl border border-[#38405f] bg-[#0e131f] focus:border-[#ff0035] focus:ring-2 focus:ring-[#ff0035]/20 text-sm font-medium text-white outline-none transition-all">
            </div>
          </div>

          <div>
            <label class="block text-xs font-bold uppercase tracking-wider text-[#8b939c] mb-1" for="username">
              Username *
            </label>
            <div class="relative">
              <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-[#8b939c]">
                <i data-lucide="at-sign" class="w-4 h-4"></i>
              </div>
              <input type="text" id="username" name="username" required value="{{ form.get('username', '') }}"
                placeholder="aarav2026"
                class="w-full pl-10 pr-4 py-2.5 rounded-xl border border-[#38405f] bg-[#0e131f] focus:border-[#ff0035] focus:ring-2 focus:ring-[#ff0035]/20 text-sm font-medium text-white outline-none transition-all">
            </div>
          </div>
        </div>

        <!-- Academic Level: School vs College -->
        <div>
          <label class="block text-xs font-bold uppercase tracking-wider text-[#8b939c] mb-1.5">
            Academic Level *
          </label>
          <div class="grid grid-cols-2 gap-3">
            <label class="cursor-pointer">
              <input type="radio" name="level" value="school" class="peer sr-only" {% if form.get('level') == 'school' %}checked{% endif %}>
              <div class="p-3 rounded-xl border border-[#38405f] bg-[#0e131f] peer-checked:border-[#ff0035] peer-checked:bg-[#ff0035]/15 peer-checked:text-white transition-all text-center">
                <div class="text-xl mb-0.5">🎒</div>
                <div class="text-xs font-bold">School (Class 9-12)</div>
              </div>
            </label>
            <label class="cursor-pointer">
              <input type="radio" name="level" value="college" class="peer sr-only" {% if form.get('level') != 'school' %}checked{% endif %}>
              <div class="p-3 rounded-xl border border-[#38405f] bg-[#0e131f] peer-checked:border-[#ff0035] peer-checked:bg-[#ff0035]/15 peer-checked:text-white transition-all text-center">
                <div class="text-xl mb-0.5">🏛️</div>
                <div class="text-xs font-bold">College / University</div>
              </div>
            </label>
          </div>
        </div>

        <!-- Program & Board -->
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-bold uppercase tracking-wider text-[#8b939c] mb-1" for="program">
              Class / Degree Program
            </label>
            <input type="text" id="program" name="program" value="{{ form.get('program', '') }}"
              placeholder="e.g. B.Tech CSE or Class 11 PCM"
              class="w-full px-3.5 py-2.5 rounded-xl border border-[#38405f] bg-[#0e131f] focus:border-[#ff0035] focus:ring-2 focus:ring-[#ff0035]/20 text-sm font-medium text-white outline-none transition-all">
          </div>

          <div>
            <label class="block text-xs font-bold uppercase tracking-wider text-[#8b939c] mb-1" for="board">
              Board / Affiliation
            </label>
            <select id="board" name="board"
              class="w-full px-3.5 py-2.5 rounded-xl border border-[#38405f] bg-[#0e131f] focus:border-[#ff0035] focus:ring-2 focus:ring-[#ff0035]/20 text-sm font-medium text-white outline-none transition-all">
              <option value="CBSE" selected>CBSE</option>
              <option value="ICSE">ICSE / ISC</option>
              <option value="State Board">State Board</option>
              <option value="University">Autonomous / University</option>
            </select>
          </div>
        </div>

        <!-- Password -->
        <div>
          <label class="block text-xs font-bold uppercase tracking-wider text-[#8b939c] mb-1" for="password">
            Password (Min. 6 chars) *
          </label>
          <div class="relative">
            <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-[#8b939c]">
              <i data-lucide="lock" class="w-4 h-4"></i>
            </div>
            <input type="password" id="password" name="password" required minlength="6"
              placeholder="••••••••"
              class="w-full pl-10 pr-4 py-2.5 rounded-xl border border-[#38405f] bg-[#0e131f] focus:border-[#ff0035] focus:ring-2 focus:ring-[#ff0035]/20 text-sm font-medium text-white outline-none transition-all">
          </div>
        </div>

        <button type="submit"
          class="w-full py-3.5 px-4 rounded-xl font-bold text-sm text-white bg-[#ff0035] hover:bg-[#d6002c] shadow-md shadow-[#ff0035]/25 transition-all flex items-center justify-center gap-2 mt-4">
          <span>Create Account &bull; Start Studying</span>
          <i data-lucide="arrow-right" class="w-4 h-4"></i>
        </button>
      </form>
    </div>

    <!-- Login Link -->
    <p class="text-center text-sm text-[#8b939c] mt-6">
      Already have an account?
      <a href="{{ url_for('login') }}" class="font-bold text-[#ff0035] hover:underline">
        Sign in here &rarr;
      </a>
    </p>

  </div>
</div>
{% endblock %}
